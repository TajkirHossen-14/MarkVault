<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">MarkVault — Your links, finally organized.</title><desc id="desc">A violet and slate banner for a private, local-first bookmark manager.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171829"/><stop offset="1" stop-color="#211937"/></linearGradient><linearGradient id="mark" x2="1" y2="1"><stop stop-color="#a68cff"/><stop offset="1" stop-color="#5736d9"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#a28bd4" opacity=".12"/></pattern></defs><rect width="1200" height="360" rx="20" fill="url(#bg)"/><rect width="1200" height="360" rx="20" fill="url(#grid)"/><rect x=".5" y=".5" width="1199" height="359" rx="20" fill="none" stroke="#45375e"/><text x="72" y="72" fill="#b9a4fa" font-family="ui-monospace,monospace" font-size="13" letter-spacing="3">YOUR INTERNET. YOUR SPACE.</text><text x="68" y="157" fill="#f4f1fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="600" letter-spacing="-3">MarkVault</text><text x="72" y="208" fill="#c7c0d7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" letter-spacing="-.5">Your links, finally organized.</text><g fill="#a89fba" font-family="ui-monospace,monospace" font-size="13"><text x="72" y="290">LOCAL-FIRST</text><text x="224" y="290">NO ACCOUNT</text><text x="372" y="290">NO TRACKING</text></g><circle cx="1025" cy="181" r="132" fill="none" stroke="#7156a4" opacity=".18"/><circle cx="1025" cy="181" r="102" fill="none" stroke="#7156a4" opacity=".24"/><rect x="938" y="90" width="174" height="184" rx="26" fill="#26213b" stroke="#4a3b6c"/><path d="M981 124h87v119l-44-29-43 29V124Z" fill="url(#mark)"/><path d="M1001 124v64l23-15 23 15v-64" fill="none" stroke="#dfd2ff" stroke-width="4"/><path d="M1131 291h13m-6.5-6.5v13M877 64h9m-4.5-4.5v9" stroke="#b39af3" stroke-width="2" opacity=".55"/></svg>
